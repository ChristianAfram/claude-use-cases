# Taxonomy for usecase_gen.
# Every generated use case = one verb x one domain x one context.
# Domains double as the categories (section headings) in each exported volume.
# Verbs must be single imperative words: generated sentences are required to start with them.

verbs:
  - Draft
  - Summarize
  - Debug
  - Analyze
  - Plan
  - Translate
  - Compare
  - Explain
  - Outline
  - Review
  - Design
  - Audit
  - Refactor
  - Brainstorm
  - Prioritize
  - Estimate
  - Rewrite
  - Extract
  - Classify
  - Forecast
  - Prepare
  - Map
  - Critique
  - Simplify
  - Convert
  - Validate
  - Document
  - Organize
  - Benchmark
  - Troubleshoot

domains:
