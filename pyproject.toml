[project]
name = "usecase-gen"
version = "0.1.0"
description = "Generate non-duplicate Claude use cases from a task x domain x context taxonomy, deduped against existing lists."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["usecase_gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
